  <script>
    // 引っ越し：前のリンク（github.io）を開いたら、端末内の保存データを持って新しいリンクへ移る
    (function () {
      var NEW_URL = "https://kdraft.pages.dev/";
      var KEYS = ["stagePickExcluded", "stagePickPresets", "kdraftCompletedDraftHistory", "kdraftResumeV2", "kdraftShortlist", "kdraftExcludedMembers", "kdraftShortlistMembers", "kdraftPrefs"];
      var toB64 = function (text) { return btoa(unescape(encodeURIComponent(text))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
      var fromB64 = function (text) { return decodeURIComponent(escape(atob(text.replace(/-/g, "+").replace(/_/g, "/")))); };
      try {
        if (/\.github\.io$/.test(location.hostname)) {
          var data = {};
          KEYS.forEach(function (key) { try { var v = localStorage.getItem(key); if (v) data[key] = v; } catch (e) {} });
          var pack = function () { return JSON.stringify({ v: 1, d: data, r: location.hash || "" }); };
          // 長すぎる時は履歴を新しい順に減らす
          while (pack().length > 60000 && data.kdraftCompletedDraftHistory) {
            var list = JSON.parse(data.kdraftCompletedDraftHistory);
            if (list.length <= 1) { delete data.kdraftCompletedDraftHistory; break; }
            data.kdraftCompletedDraftHistory = JSON.stringify(list.slice(0, Math.floor(list.length / 2)));
          }
          document.documentElement.style.visibility = "hidden";
          location.replace(NEW_URL + location.search + "#kdmove=" + toB64(pack()));
          return;
        }
        if (location.hash.indexOf("#kdmove=") === 0) {
          var moved = JSON.parse(fromB64(location.hash.slice(8)));
          var incoming = (moved && moved.d) || {};
          var read = function (key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } };
          var write = function (key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} };
          Object.keys(incoming).forEach(function (key) {
            if (KEYS.indexOf(key) < 0) return;
            var value; try { value = JSON.parse(incoming[key]); } catch (e) { return; }
            var current = read(key);
            if (Array.isArray(value) && key !== "kdraftCompletedDraftHistory") {
              var merged = (Array.isArray(current) ? current : []).slice();
              value.forEach(function (item) { if (merged.indexOf(item) < 0) merged.push(item); });
              write(key, merged);
            } else if (key === "kdraftCompletedDraftHistory" && Array.isArray(value)) {
              var all = (Array.isArray(current) ? current : []).slice();
              value.forEach(function (entry) { if (entry && !all.some(function (x) { return x && x.id === entry.id; })) all.push(entry); });
              all.sort(function (a, b) { return (b && b.completedAt || 0) - (a && a.completedAt || 0); });
              write(key, all.slice(0, 20));
            } else if (key === "stagePickPresets" && value && typeof value === "object") {
              var presets = current && typeof current === "object" ? current : {};
              Object.keys(value).forEach(function (name) { if (!(name in presets)) presets[name] = value[name]; });
              write(key, presets);
            } else if (current == null) {
              write(key, value);
            }
          });
          history.replaceState(null, "", location.pathname + location.search + (moved && moved.r && moved.r.indexOf("#kdmove=") !== 0 ? moved.r : "#/"));
        }
      } catch (e) {
        if (location.hash.indexOf("#kdmove=") === 0) history.replaceState(null, "", location.pathname + location.search + "#/");
      }
    })();
  </script>
